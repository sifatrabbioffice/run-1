name: Build Windows x86 Emulator IPA

on:
  workflow_dispatch:

jobs:
  build-ios-emulator:
    runs-on: macos-latest
    steps:
      - name: Set up Xcode Environment
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Create Project Directory structure
        run: |
          mkdir -p WinEmuApp/Sources
          mkdir -p WinEmuApp/Resources

      - name: Generate Swift Source Code (Landscape WebView with x86 Core)
        run: |
          cat << 'EOF' > WinEmuApp/Sources/App.swift
          import SwiftUI
          @main
          struct WinEmuApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat << 'EOF' > WinEmuApp/Sources/ContentView.swift
          import SwiftUI
          import WebKit

          struct EmulatorWebView: UIViewRepresentable {
              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.scrollView.isScrollEnabled = false
                  webView.scrollView.bounces = false
                  
                  // Load v86 Emulator Core (x86 Architecture)
                  if let url = URL(string: "https://copy.sh/v86/?profile=windows2000") {
                      webView.load(URLRequest(url: url))
                  }
                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          struct ContentView: View {
              var body: some View {
                  EmulatorWebView()
                      .edgesIgnoringSafeArea(.all)
                      .background(Color.black) // Prevents white flashes, maintains dark aesthetic
              }
          }
          EOF

      - name: Create project.yml for xcodegen
        run: |
          cat << 'EOF' > project.yml
          name: WinEmuApp
          options:
            bundleIdPrefix: com.custom.winemu
          targets:
            WinEmuApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: [WinEmuApp/Sources]
              info:
                path: Info.plist
                properties:
                  UILaunchStoryboardName: LaunchScreen
                  UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
                  UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
                  UIRequiresFullScreen: true
                  WKAppBoundDomains: ["copy.sh"]
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Xcode Project (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project WinEmuApp.xcodeproj \
            -scheme WinEmuApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/WinEmuApp.app Payload/
          zip -r WinEmuApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinEmuApp-Landscape
          path: WinEmuApp.ipa
