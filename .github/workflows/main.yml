name: Build iPhone App for Sonic EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Environment
        run: |
          brew install dpkg
          # এখানে আমরা গেম ফাইলটি প্রস্তুত করছি
          mkdir -p AppStructure/Payload/SonicApp.app
          cp SONIC.EXE AppStructure/Payload/SonicApp.app/

      - name: Create App Bundle Structure
        run: |
          # অ্যাপের ইনফরমেশন ফাইল তৈরি (Info.plist)
          cat <<EOF > AppStructure/Payload/SonicApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>SonicLauncher</string>
              <key>CFBundleIdentifier</key>
              <string>com.user.sonicexe</string>
              <key>CFBundleName</key>
              <string>SonicEXE</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
          </dict>
          </plist>
          EOF

      - name: Create Launch Script (Anti-Black Screen)
        run: |
          # এটি অ্যাপ ওপেন হওয়ার পর সরাসরি গেম রান করার স্ক্রিপ্ট
          cat <<EOF > AppStructure/Payload/SonicApp.app/SonicLauncher
          #!/bin/bash
          # এমুলেটর কল করার কমান্ড (যেমন iDOS বা Wine layer)
          ./emulator_core --run SONIC.EXE --fullscreen --no-console
          EOF
          chmod +x AppStructure/Payload/SonicApp.app/SonicLauncher

      - name: Package IPA
        run: |
          cd AppStructure
          zip -r ../SonicEXE.ipa Payload/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: iPhone-Sonic-App
          path: SonicEXE.ipa
