name: Build iOS App (IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.33
          brew install autoconf automake libtool pkg-config requests
          pip install buildozer

      - name: Create main.py (App Logic)
        run: |
          cat <<EOF > main.py
          from kivy.app import App
          from kivy.uix.label import Label
          from kivy.uix.boxlayout import BoxLayout
          import os

          class SonicExecutorApp(App):
              def build(self):
                  layout = BoxLayout(orientation='vertical')
                  # এখানে আপনার ফাইল রান করার লজিক থাকবে
                  # মনে রাখবেন, সরাসরি .exe আইফোনে রান হবে না
                  # এটি কেবল একটি ইন্টারফেস হিসেবে কাজ করবে
                  lbl = Label(text="Application Running...")
                  layout.add_widget(lbl)
                  return layout

          if __name__ == '__main__':
              SonicExecutorApp().run()
          EOF

      - name: Initialize Buildozer
        run: buildozer init

      - name: Configure buildozer.spec
        run: |
          # এখানে অ্যাপের নাম এবং প্যাকেজ সেট করা হচ্ছে
          sed -i '' 's/^title = .*/title = SonicApp/' buildozer.spec
          sed -i '' 's/^package.name = .*/package.name = sonicapp/' buildozer.spec
          sed -i '' 's/^package.domain = .*/package.domain = org.test/' buildozer.spec
          sed -i '' 's/^source.include_exts = .*/source.include_exts = py,png,jpg,kv,atlas,exe/' buildozer.spec
          # ব্ল্যাক স্ক্রিন এড়াতে স্প্ল্যাশ স্ক্রিন সেট করা
          sed -i '' 's/^#ios.kivy_ios_url = .*/ios.kivy_ios_url = https:\/\/github.com\/kivy\/kivy-ios/' buildozer.spec

      - name: Build IPA with Buildozer
        run: |
          # এই কমান্ডটি IPA তৈরি করবে। এটি অনেক সময় নিতে পারে।
          buildozer ios debug
        env:
          BUILDOZER_WARN_ON_ROOT: 1

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-app-ipa
          path: bin/*.ipa
